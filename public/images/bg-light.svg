<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="light game table background">
  <defs>
    <filter id="soft" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="70" />
    </filter>
    <pattern id="dots" width="56" height="56" patternUnits="userSpaceOnUse">
      <circle cx="2.5" cy="2.5" r="1.6" fill="#92400e" opacity="0.10" />
    </pattern>
    <pattern id="tiles" width="72" height="72" patternUnits="userSpaceOnUse">
      <rect x="3" y="3" width="66" height="66" rx="12" fill="none" stroke="#b45309" stroke-width="1.5" stroke-opacity="0.12" />
      <circle cx="36" cy="36" r="1.6" fill="#92400e" opacity="0.14" />
    </pattern>
  </defs>

  <!-- soft colour washes so the flat theme tint never looks flat -->
  <circle cx="-60" cy="140" r="330" fill="#f59e0b" opacity="0.18" filter="url(#soft)" />
  <circle cx="1320" cy="60" r="380" fill="#38bdf8" opacity="0.13" filter="url(#soft)" />
  <circle cx="1260" cy="840" r="360" fill="#f97316" opacity="0.15" filter="url(#soft)" />
  <circle cx="-40" cy="780" r="330" fill="#34d399" opacity="0.13" filter="url(#soft)" />
  <circle cx="640" cy="160" r="260" fill="#f472b6" opacity="0.09" filter="url(#soft)" />

  <!-- table-top texture: game-board tiles + stitching -->
  <rect width="1280" height="800" fill="url(#tiles)" />
  <g stroke="#92400e" stroke-opacity="0.07" stroke-width="2">
    <line x1="0" y1="0" x2="1280" y2="800" />
    <line x1="0" y1="180" x2="1280" y2="980" />
    <line x1="320" y1="-60" x2="320" y2="860" />
  </g>

  <!-- mini tic-tac-toe grids -->
  <g fill="none" stroke="#b45309" stroke-opacity="0.16" stroke-width="3" stroke-linecap="round">
    <rect x="56" y="120" width="96" height="96" rx="8" />
    <path d="M104 120 v96 M56 168 h96" />
    <rect x="1128" y="120" width="96" height="96" rx="8" />
    <path d="M1176 120 v96 M1128 168 h96" />
  </g>

  <!-- scattered game pieces -->
  <g opacity="0.15">
    <!-- X marks -->
    <g stroke="#f43f5e" stroke-width="14" stroke-linecap="round">
      <line x1="150" y1="160" x2="210" y2="220" />
      <line x1="210" y1="160" x2="150" y2="220" />
      <line x1="1120" y1="640" x2="1180" y2="700" />
      <line x1="1180" y1="640" x2="1120" y2="700" />
    </g>
    <!-- O rings -->
    <g fill="none" stroke="#0ea5e9" stroke-width="14">
      <circle cx="1088" cy="180" r="42" />
      <circle cx="176" cy="620" r="42" />
    </g>
    <!-- coins / tokens -->
    <g fill="#f59e0b" stroke="#b45309" stroke-width="6">
      <circle cx="300" cy="300" r="36" />
      <circle cx="300" cy="300" r="20" fill="none" />
      <circle cx="980" cy="430" r="36" />
      <circle cx="980" cy="430" r="20" fill="none" />
    </g>
    <!-- dice -->
    <g>
      <rect x="540" y="470" width="72" height="72" rx="16" fill="#f97316" />
      <g fill="#fff7ed">
        <circle cx="563" cy="493" r="5" />
        <circle cx="589" cy="493" r="5" />
        <circle cx="563" cy="519" r="5" />
      </g>
      <rect x="700" y="120" width="64" height="64" rx="14" fill="#f97316" />
      <g fill="#fff7ed">
        <circle cx="716" cy="144" r="5" />
        <circle cx="734" cy="162" r="5" />
        <circle cx="752" cy="144" r="5" />
      </g>
    </g>
    <!-- sparkles -->
    <path d="M1190 300 q6 16 22 22 q-16 6 -22 22 q-6 -16 -22 -22 q16 -6 22 -22 z" fill="#fbbf24" />
    <path d="M90 420 q4 11 15 15 q-11 4 -15 15 q-4 -11 -15 -15 q11 -4 15 -15 z" fill="#fbbf24" />
    <!-- pawn tokens -->
    <g fill="#8b5cf6">
      <circle cx="428" cy="600" r="15" />
      <path d="M410 618 h36 l6 16 h-48 z" />
      <path d="M404 634 h54 a7 7 0 0 1 -7 7 h-40 a7 7 0 0 1 -7 -7 z" />
    </g>
  </g>

  <!-- big soft board ellipse framing the centre -->
  <g transform="translate(640,500)" fill="none" stroke="#b45309">
    <ellipse rx="400" ry="140" stroke-width="3" stroke-opacity="0.09" />
    <ellipse rx="400" ry="140" stroke-width="1.5" stroke-opacity="0.06" transform="translate(0,14)" />
  </g>

  <!-- gentle flourishes -->
  <g fill="none" stroke="#0f766e" stroke-width="8" stroke-linecap="round" stroke-opacity="0.16">
    <path d="M40 350 q30 -40 60 0 q30 40 60 0" />
    <path d="M1120 400 q30 -40 60 0 q30 40 60 0" />
  </g>
</svg>
